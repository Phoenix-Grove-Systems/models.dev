# Cache key (chat): strip prompt_cache_key — OpenAI-compatible passthrough that keeps requests unchanged; docs publish cached-input billing but no cache-key param.
# Cache headers: none
# Cache policy: automatic prefix cache billed at the cached-input rate; reuse stable prefixes verbatim.
# Docs: https://api.koscompute.com/docs/
name = "Kosmik Compute"
env = ["KOSMIK_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://api.koscompute.com/v1"
doc = "https://api.koscompute.com/docs/"
