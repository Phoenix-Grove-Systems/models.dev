# Cache key (chat): send prompt_cache_key — OpenAI/Anthropic-compatible router with no documented field rejection (400s only for unknown model names).
# Cache headers: none
# Cache policy: no documented chat cache controls; cache-read rates published as a billing ceiling in model costs; keep stable prefixes.
# Docs: https://neosmith.ai/docs
name = "NeoSmith"

env = ["NEOSMITH_API_KEY"]

npm = "@ai-sdk/openai"

api = "https://router.neosmith.ai/v1"

doc = "https://neosmith.ai/docs"
