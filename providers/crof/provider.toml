# Cache key (chat): strip prompt_cache_key — Supported Parameters is a closed list (max_tokens/temperature/top_p/stop/seed/tools/reasoning_effort/response_format/repetition_penalty) with no cache key; backend reuse surfaces as cached_tokens in usage.
# Cache headers: none
# Cache policy: backend automatic reuse; resend a stable prefix, no request control.
# Docs: https://crof.ai/docs.md
name = "CrofAI"
env = ["CROF_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Raw OpenAI Chat is POST `/v1/chat/completions` (also `/v2/chat/completions`);
# Anthropic compatibility is POST `https://anthropic.nahcrof.com/v1/messages`.
# Chat accepts `reasoning_effort = none|low|medium|high`; `none` disables
# reasoning. No reasoning-token budget field is documented.
# https://crof.ai/docs.md (accessed 2026-06-25)
api = "https://crof.ai/v1"
doc = "https://crof.ai/docs"