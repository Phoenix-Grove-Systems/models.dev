# Cache key (chat): send prompt_cache_key — docs give automatic prefix caching plus optional prompt_cache_key routing hint; values over 1024 chars are rejected with 400.
# Cache headers: usage.prompt_tokens_details.cached_tokens (greater than 0 means a hit).
# Cache policy: send the same key (max 1024 chars) for requests sharing a prefix; keep prefixes stable and append-only; one shared key per conversation, not per common system prompt.
# Docs: https://inference-docs.cerebras.ai/capabilities/prompt-caching
name = "Cerebras"
env = ["CEREBRAS_API_KEY"]
npm = "@ai-sdk/cerebras"
# Reasoning HTTP format (accessed 2026-06-25):
# OpenAI Chat: POST https://api.cerebras.ai/v1/chat/completions.
# Effort/toggle: top-level reasoning_effort, with accepted values depending on
# the model. Token budget is not documented in the complete request schema.
# Sources:
# https://inference-docs.cerebras.ai/api-reference/chat-completions
# https://inference-docs.cerebras.ai/capabilities/reasoning
# https://inference-docs.cerebras.ai/resources/openai
doc = "https://inference-docs.cerebras.ai/models/overview"
