# Cache key (chat): send prompt_cache_key — RouteLLM gateway forwards chat body to routed model; API ref documents no closed schema and no 400 on extra fields; @ai-sdk/openai-compatible passes extra body through upstream.
# Cache headers: none
# Cache policy: gateway passthrough; hit via routed model's automatic prefix cache (stable prefix, same routed model).
# Docs: https://abacus.ai/help/api
name = "Abacus"
npm = "@ai-sdk/openai-compatible"
# Reasoning HTTP format (accessed 2026-06-25):
# Audited POST https://routellm.abacus.ai/v1/chat/completions. The provider API
# reference documents no reasoning toggle, effort, or numeric budget request
# field. Do not infer behavior from the routed model developer's API.
# Sources:
# https://abacus.ai/help/api
env = ["ABACUS_API_KEY"]
doc = "https://abacus.ai/help/api"
api = "https://routellm.abacus.ai/v1"
