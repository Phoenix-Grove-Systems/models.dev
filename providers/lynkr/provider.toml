# Cache key (chat): strip prompt_cache_key — self-hosted gateway with no documented chat prompt_cache_key; forwards upstream.
# Cache headers: none
# Cache policy: gateway semantic cache plus upstream passthrough; no native chat-cache billing.
# Docs: https://github.com/Fast-Editor/Lynkr
name = "Lynkr"
# Lynkr is a self-hosted gateway: any non-empty API key is accepted locally;
# provider credentials live in Lynkr's own configuration.
env = ["LYNKR_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "http://127.0.0.1:8081/v1"
doc = "https://github.com/Fast-Editor/Lynkr"
