# Cache key (chat): strip prompt_cache_key — auto-cache exists but body key unsupported on chat per Bifrost dropped-params, Zed #36215, Groq Responses docs.
# Cache headers: none
# Cache policy: automatic exact-prefix cache on supported models (gpt-oss-20b/120b), 50% cached-input discount, 2h expiry, usage.prompt_tokens_details.cached_tokens
# Docs: https://console.groq.com/docs/prompt-caching
name = "Groq"
env = ["GROQ_API_KEY"]
npm = "@ai-sdk/groq"
# Reasoning HTTP format (accessed 2026-06-25):
# POST https://api.groq.com/openai/v1/chat/completions
# JSON reasoning_effort is model-specific; reasoning_format: "parsed" | "raw" |
# "hidden" controls presentation, not reasoning. include_reasoning: true | false
# controls returned reasoning and is mutually exclusive with reasoning_format.
# Sources:
# https://console.groq.com/docs/reasoning
doc = "https://console.groq.com/docs/models"