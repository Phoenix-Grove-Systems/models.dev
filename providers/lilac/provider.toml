# Cache key (chat): strip prompt_cache_key — chat request params list no key field; caching is server-side only.
# Cache headers: none
# Cache policy: automatic prefix cache on shared warm vLLM endpoints; repeated prefixes bill at the cache-read rate — stable content first, volatile last.
# Docs: https://docs.getlilac.com/inference/pricing
# POST /v1/chat/completions carries model-template controls under
# $.chat_template_kwargs; keys and values are model-specific, not universal.
# https://docs.getlilac.com/inference/chat-completions (accessed 2026-06-25)
name = "Lilac"
env = ["LILAC_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://api.getlilac.com/v1"
doc = "https://docs.getlilac.com/inference/models"
