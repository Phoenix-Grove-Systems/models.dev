# Cache key (chat): strip prompt_cache_key — prompt_cache_key is Responses-only; chat steering uses the x-grok-conv-id header.
# Cache headers: x-grok-conv-id steering — same ID routes to the same server for per-server prefix cache hits.
# Cache policy: automatic prefix cache on shared leading messages; reuse stable prefixes + conversation ID; hits via usage.prompt_tokens_details.cached_tokens.
# Docs: https://docs.x.ai/developers/advanced-api-usage/prompt-caching
name = "xAI"
env = ["XAI_API_KEY"]
npm = "@ai-sdk/xai"
doc = "https://docs.x.ai/docs/models"