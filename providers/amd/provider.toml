# Cache key (chat): strip prompt_cache_key — chat-completions allowlist has no prompt_cache_key; gateway rebuilds body field-by-field and drops unknown params silently
# Cache headers: none — no cache_control/cachePoint/prompt_cache_* in chat request schema
# Cache policy: reuse static prefix; hits reported as usage.prompt_tokens_details.cached_tokens; no client control documented
# Docs: https://amd-aim.github.io/radeon-cloud-docs/api/chat-completions/
name = "AMD"
env = ["AMD_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Token Factory (BETA) / Radeon Cloud, China endpoint
api = "https://developer.amd.com.cn/radeon/api/v1"
doc = "https://developer.amd.com.cn/radeon/tokenfactory"