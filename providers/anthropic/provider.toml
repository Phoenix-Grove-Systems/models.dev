# Cache key (chat): strip prompt_cache_key — Messages API has no prompt_cache_key field; caching uses cache_control breakpoints, SDK sends cache_control
# Cache headers: cache_control {"type": "ephemeral", "ttl": "5m"|"1h"} top-level for server-placed breakpoint or per-block for explicit breakpoints
# Cache policy: mark end of stable prefix (tools→system→messages order); meet per-model minimum (1024 default, varies); repeat exact prefix within TTL
# Docs: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
name = "Anthropic"
env = ["ANTHROPIC_API_KEY"]
npm = "@ai-sdk/anthropic"
doc = "https://docs.anthropic.com/en/docs/about-claude/models"
