# Cache key (chat): strip prompt_cache_key — no key field in the chat reference; the gateway derives its own cache key from request params and translates cache_control per upstream.
# Cache headers: x-llmgateway-cache (HIT on gateway replay), x-no-cache (per-request bypass)
# Cache policy: gateway $0 byte-identical replay (opt-in per project, TTL default 60s) plus provider cache-control translation/injection; provider-pinned catalog on the same endpoint; stable prefix first.
# Docs: https://docs.llmgateway.io/features/caching
# The provider-pinned LLM Gateway catalog: one entry per upstream provider
# mapping, addressed as `provider/model-id` — the format the gateway accepts to
# pin a request to a specific upstream provider. The aggregated, auto-routed
# catalog of root model IDs lives in the `llmgateway` provider
# ("DevPass (LLM Gateway)"). Both are served by the same endpoint and API key.
#
# POST /v1/chat/completions accepts $.reasoning_effort = none|minimal|low|
# medium|high|xhigh|max. Its raw schema lists $.reasoning.effort = low|medium|
# high; the two effort paths are mutually exclusive. $.reasoning.max_tokens
# overrides either effort path. Anthropic budgets are clamped to 1024..128000.
# POST /v1/messages translates $.thinking to unified reasoning controls; its
# $.output_config.effort controls adaptive depth on Opus 4.7+.
# https://docs.llmgateway.io/features/reasoning (accessed 2026-06-25)
# https://docs.llmgateway.io/v1_messages (accessed 2026-06-25)
name = "LLM Gateway"
env = ["LLMGATEWAY_API_KEY"]
npm = "@ai-sdk/openai-compatible"
doc = "https://llmgateway.io/docs"
api = "https://api.llmgateway.io/v1"
