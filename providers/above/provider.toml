# Cache key (chat): strip prompt_cache_key — closed request-body tables for POST /v1/messages and /v1/chat/completions list no prompt_cache_key (messages, max_tokens, stream, temperature, top_p, tools, tool_choice, response_format); chat alias delegates to messages with no additionalProperties passthrough documented.
# Cache headers: none (x-session-id groups usage reporting only, also accepted as session_id body; cache hits surface via x-input-cache-hit-rate / x-input-cache-hit-tokens response headers)
# Cache policy: automatic upstream prefix cache passthrough with full discount; verify per response via x-input-cache-hit-rate.
# Docs: https://above.dev/docs
name = "above.dev"
env = ["ABOVE_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# OpenAI-compatible gateway selling upstream cost plus a flat 10% on every
# token class, with the full upstream cache-hit discount passed through.
# DeepSeek models use time-of-day pricing (peak = 2x, weekdays 01:00-04:00 and
# 06:00-10:00 UTC; weekends off-peak); costs below are the off-peak rate.
# Every response reports its exact cost in the `x-cost-usd` header.
# https://above.dev/llms.txt
api = "https://api.above.dev/v1"
doc = "https://above.dev/docs"
