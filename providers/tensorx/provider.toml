# Cache key (chat): strip prompt_cache_key — closed chat schema lists no cache fields; invalid params return 400.
# Cache headers: none.
# Cache policy: automatic best-effort KV prefix reuse on warm replicas; repeat stable prefixes, confirm via prompt_tokens_details.cached_tokens.
# Docs: https://docs.tensorx.ai/api-reference/prompt-caching
name = "TensorX"
env = ["TENSORX_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://api.tensorx.ai/v1"
doc = "https://docs.tensorx.ai/"
