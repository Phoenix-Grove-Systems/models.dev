# Cache key (chat): strip prompt_cache_key — OpenAPI schema for POST /v1/chat/completions allows model/messages/reasoning.effort only; no cache field.
# Cache headers: none
# Cache policy: no documented cache — replay stable prefixes; treat usage as uncached.
# Docs: https://www.xpersona.co/api/v1/openapi/ai-public
name = "Xpersona"
# POST /v1/chat/completions accepts reasoning.effort set to "low", "medium",
# "high", "xhigh", or "max"; no disable sentinel or token budget is documented.
# https://www.xpersona.co/api/v1/openapi/ai-public (accessed 2026-06-25)
env = ["XPERSONA_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://www.xpersona.co/v1"
doc = "https://www.xpersona.co/docs"
