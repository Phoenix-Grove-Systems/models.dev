# Cache key (chat): strip prompt_cache_key — OpenAI-compatible chat API; caching is automatic MemoryAlloy cache-aware routing with no request cache field.
# Cache headers: none
# Cache policy: automatic — MemoryAlloy cluster-wide memory fabric routes repeat prefixes to warm nodes; resend identical prefixes on the same model to hit.
# Docs: https://docs.crusoecloud.com/serverless-inference/overview
name = "Crusoe"
env = ["CRUSOE_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://api.inference.crusoecloud.com/v1"
doc = "https://docs.crusoecloud.com/managed-inference/overview"
