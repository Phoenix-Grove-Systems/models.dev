# Cache key (chat): strip prompt_cache_key — OpenAI chat schema takes model/messages/sampling fields only; cache surfaces via usage.prompt_tokens_details.cached_tokens (Anthropic: cache_read_input_tokens), no key field.
# Cache headers: none
# Cache policy: automatic prefix prompt cache; prefix hits billed at cache-hit price with free cache write — replay stable prefixes.
# Docs: https://platform.xiaomimimo.com/#/docs
name = "Xiaomi Token Plan (China)"
# Raw endpoints are POST https://token-plan-cn.xiaomimimo.com/v1/chat/completions
# and POST https://token-plan-cn.xiaomimimo.com/anthropic/v1/messages.
# Both protocols use thinking.type="enabled"|"disabled"; Flash defaults
# disabled, while V2.5 Pro, V2.5, and V2 Pro default enabled.
# https://platform.xiaomimimo.com/static/docs/price/tokenplan/quick-access.md (accessed 2026-06-25)
# https://platform.xiaomimimo.com/static/docs/api/chat/openai-api.md (accessed 2026-06-25)
env = ["XIAOMI_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://token-plan-cn.xiaomimimo.com/v1"
doc = "https://platform.xiaomimimo.com/#/docs"
