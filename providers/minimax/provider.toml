# Cache key (chat): strip prompt_cache_key — Anthropic surface uses explicit cache_control blocks, not OpenAI prompt_cache_key.
# Cache headers: none — hits via usage.cache_read_input_tokens and cache_creation_input_tokens.
# Cache policy: explicit cache_control type ephemeral breakpoints (max 4); 5-min TTL refreshed on hit; tools to system to messages hierarchy.
# Docs: https://platform.minimax.io/docs/api-reference/anthropic-api-compatible-cache
name = "MiniMax (minimax.io)"
env = ["MINIMAX_API_KEY"]
npm = "@ai-sdk/anthropic"
doc = "https://platform.minimax.io/docs/guides/quickstart"
api = "https://api.minimax.io/anthropic/v1"
