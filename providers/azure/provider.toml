# Cache key (chat): send prompt_cache_key — docs give automatic prefix caching plus prompt_cache_key matching on GPT-5.6 and later, no special API version needed.
# Cache headers: usage.prompt_tokens_details.cached_tokens (plus cache_write_tokens on GPT-5.6 and later Standard deployments).
# Cache policy: keep the first 1024+ tokens identical; reuse the same key per shared prefix; partition keys past ~15 rpm per prefix+key.
# Docs: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/prompt-caching
name = "Azure"
env = ["AZURE_RESOURCE_NAME", "AZURE_API_KEY"]
npm = "@ai-sdk/azure"
doc = "https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models"