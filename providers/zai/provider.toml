# Cache key (chat): strip prompt_cache_key — implicit automatic context caching; requests take model/messages only with no key field, hits via usage.prompt_tokens_details.cached_tokens.
# Cache headers: none
# Cache policy: automatic implicit prefix cache — replay stable system prompts/history for hits; cached tokens billed discounted.
# Docs: https://docs.z.ai/guides/capabilities/cache
# Chat reasoning: POST https://api.z.ai/api/paas/v4/chat/completions with
# `thinking.type = "enabled" | "disabled"` (default: enabled).
# https://docs.z.ai/guides/capabilities/thinking (accessed 2026-06-25)
name = "Z.AI"
env = ["ZHIPU_API_KEY"]
npm = "@ai-sdk/openai-compatible"
doc = "https://docs.z.ai/guides/overview/pricing"
api = "https://api.z.ai/api/paas/v4"
