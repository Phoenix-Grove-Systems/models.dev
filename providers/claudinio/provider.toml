# Cache key (chat): strip prompt_cache_key — API reference lists a closed param set (messages/temperature/top_p/max_tokens/stream/stop/tools/response_format, n=1) and 400s unsupported params (n>1 → unsupported_parameter); no cache field.
# Cache headers: none
# Cache policy: no documented cache behavior; nothing to set.
# Docs: https://claudin.io/docs/api-reference/
name = "Claudinio"
env = ["CLAUDINIO_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Raw HTTP routes are POST `/v1/chat/completions`, `/v1/responses`, and
# `/v1/messages`. The documented request fields do not include a reasoning
# toggle, effort, or token-budget field.
# https://claudin.io/docs/api-reference/ (accessed 2026-06-25)
doc = "https://claudin.io"
api = "https://api.claudin.io/v1"
