# Cache key (chat): strip prompt_cache_key — OpenAI-compatible POST /v1/chat/completions; public docs define no cache field.
# Cache headers: none
# Cache policy: no documented path to a cache hit — the API exposes no prefix-cache behavior.
# Docs: https://www.d.run
name = "D.Run (China)"
npm = "@ai-sdk/openai-compatible"
# Raw HTTP is POST `/v1/chat/completions`. The public d.run documentation and
# request surface document no reasoning toggle, effort, or token-budget field.
# https://www.d.run (accessed 2026-06-25)
env = ["DRUN_API_KEY"]
api = "https://chat.d.run/v1"
doc = "https://www.d.run"
