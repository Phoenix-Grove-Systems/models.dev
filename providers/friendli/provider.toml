# Cache key (chat): strip prompt_cache_key — OpenAPI ServerlessChatCompletionBody omits key (required model/messages only; lists reasoning_effort/budget but no key); SDK sends only listed fields; usage reports cached_tokens.
# Cache headers: none (X-Friendli-Team is team routing, not cache).
# Cache policy: automatic prefix caching; keep stable exact prefix on same model with no client key or marker; verify via usage.prompt_tokens_details.cached_tokens and Cached Input pricing.
# Docs: https://friendli.ai/docs/openapi/model-apis/chat-completions
name = "Friendli"
# Reasoning HTTP format (accessed 2026-08-29): POST /serverless/v1/chat/completions.
# Toggle: chat_template_kwargs.enable_thinking = true | false; support is model-specific.
# Effort: reasoning_effort = minimal|low|medium|high|xhigh|max|ultracode; reasoning
# models only, available options depend on the model.
# Budget: reasoning_budget (positive integer reasoning-token cap); reasoning models only.
# https://friendli.ai/docs/openapi/model-apis/chat-completions#body-reasoning-effort-one-of-0
# https://friendli.ai/docs/openapi/model-apis/chat-completions#body-reasoning-budget-one-of-0
# https://friendli.ai/docs/guides/reasoning
env = ["FRIENDLI_TOKEN"]
npm = "@ai-sdk/openai-compatible"
api = "https://api.friendli.ai/serverless/v1"
doc = "https://friendli.ai/docs/guides/serverless_endpoints/introduction"
