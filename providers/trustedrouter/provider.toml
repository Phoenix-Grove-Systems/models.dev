# Cache key (chat): strip prompt_cache_key — chat has no router setting; prompt_cache_retention returns 501.
# Cache headers: none (Anthropic messages route preserves native cache_control breakpoints).
# Cache policy: automatic provider-native prefix cache; keep prefix stable, pin provider.only for locality, read cached_tokens.
# Docs: https://trustedrouter.com/docs/prompt-caching
name = "TrustedRouter"
env = ["TRUSTEDROUTER_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://api.trustedrouter.com/v1"
doc = "https://trustedrouter.com/docs"
