# Cache key (chat): strip prompt_cache_key — chat body is model/messages/stream/max_tokens/temperature/top_p/thinking; no prompt_cache_key despite Cached Input billing.
# Cache headers: none
# Cache policy: automatic server-side prefix caching; billed as Cached Input vs Uncached Input.
# Docs: https://longcat.chat/platform/docs/api/chat
name = "LongCat"
npm = "@ai-sdk/openai-compatible"
api = "https://api.longcat.chat/openai"
env = ["LONGCAT_API_KEY"]
doc = "https://longcat.chat/platform/docs/"
