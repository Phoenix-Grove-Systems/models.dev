# Cache key (chat): send prompt_cache_key — documented top-level body field for sticky worker routing (header wins when both sent); hits in usage.prompt_tokens_details.cached_tokens.
# Cache headers: x-session-id (same conversation id as header carrier alternative)
# Cache policy: one key per conversation incl. retries, never a shared app-wide value; stable content first, byte-identical prefix; optional cache_ttl 5m/30m/1h/6h/24h.
# Docs: https://docs.morphllm.com/sdk/components/caching
name = "Morph"
env = ["MORPH_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Raw HTTP for the configured Apply models is POST `/v1/chat/completions`.
# Morph documents no reasoning toggle, effort, or token-budget request field
# for `morph-v3-fast`, `morph-v3-large`, or `auto`.
# https://docs.morphllm.com/llms.txt (accessed 2026-06-25)
api = "https://api.morphllm.com/v1"
doc = "https://docs.morphllm.com/api-reference/introduction" 