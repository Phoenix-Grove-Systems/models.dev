# Cache key (chat): strip prompt_cache_key — Vertex Claude uses Anthropic cache_control breakpoints, not an OpenAI-style body key.
# Cache headers: none
# Cache policy: cache_control ephemeral breakpoints with 5-minute TTL on Vertex (Vertex/Bedrock support 5min only); 1024-token minimum
# Docs: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/claude/prompt-caching
name = "Vertex (Anthropic)"
env = ["GOOGLE_VERTEX_PROJECT", "GOOGLE_VERTEX_LOCATION", "GOOGLE_APPLICATION_CREDENTIALS"]
npm = "@ai-sdk/google-vertex/anthropic"
doc = "https://cloud.google.com/vertex-ai/generative-ai/docs/partner-models/claude"