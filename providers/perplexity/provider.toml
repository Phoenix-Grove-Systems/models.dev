# Cache key (chat): strip prompt_cache_key — Sonar POST /v1/sonar OpenAPI schema lists closed request fields with no prompt_cache_key or cache_control; usage has no cached_tokens.
# Cache headers: none
# Cache policy: no documented cache controls, cache usage fields, or cache rates on Sonar chat; do not send key.
# Docs: https://docs.perplexity.ai/api-reference/sonar-post
name = "Perplexity"
env = ["PERPLEXITY_API_KEY"]
npm = "@ai-sdk/perplexity"
# Reasoning HTTP format (accessed 2026-06-25):
# POST https://api.perplexity.ai/v1/sonar
# JSON reasoning_effort: "minimal" | "low" | "medium" | "high" | null.
# No raw HTTP reasoning toggle or reasoning-token budget is documented.
# Sources:
# https://docs.perplexity.ai/api-reference/sonar-post
doc = "https://docs.perplexity.ai"
