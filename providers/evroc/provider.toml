# Cache key (chat): strip prompt_cache_key — closed supported-params list (model/messages/stream/temperature/max_tokens/tools/response_format/top_p/seed) omits key and cache usage; OpenAI client works unchanged via base_url.
# Cache headers: none
# Cache policy: no documented cache mechanism; no hit expected; keep stable prefix for any future automatic behavior.
# Docs: https://docs.evroc.com/products/think/openai-compatibility.html
name = "evroc"
# Reasoning HTTP format (accessed 2026-06-25): POST /v1/chat/completions.
# evroc documents OpenAI compatibility but no toggle, effort, or budget field;
# the raw reasoning-control surface is undocumented.
# https://docs.evroc.com/products/think/overview.html
env = ["EVROC_API_KEY"]
npm = "@ai-sdk/openai-compatible"
doc = "https://docs.evroc.com/products/think/overview.html"
api = "https://models.think.evroc.com/v1"
