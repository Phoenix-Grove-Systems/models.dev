# Cache key (chat): send prompt_cache_key — docs list no cache param; request schema omits prompt_cache_key with no additionalProperties:false, so the key is accepted but ignored.
# Cache headers: none.
# Cache policy: no key-based control; identical-prefix reuse only if the upstream backend applies it.
# Docs: https://docs.arcee.ai/api-reference/chat-completion
name = "Arcee"
npm = "@ai-sdk/openai-compatible"
env = ["ARCEE_API_KEY"]
api = "https://api.arcee.ai/api/v1"
doc = "https://docs.arcee.ai"
