# Reasoning controls for the whole API surface (verified 2026-07-28):
# https://docs.abliteration.ai/capabilities/thinking
# Both models reason by default. Effort ladder, least to most:
# none (disables reasoning), minimal, low, medium, high, xhigh, max.
# Request field per endpoint:
# - POST /v1/chat/completions: top-level "reasoning_effort": "<level>"
#   (legacy top-level "thinking": false also disables reasoning)
# - POST /v1/responses: "reasoning": { "effort": "<level>" }
# - POST /v1/messages: "output_config": { "effort": "<level>" } or
#   "thinking": { "type": "enabled", "budget_tokens": <n> };
#   "thinking": false disables reasoning
# Cache key (chat): send prompt_cache_key — first-party prompt-caching doc gives Chat Completions JSON example with "prompt_cache_key": "conv_7d2a9f" as routing hint; when both key and header present, x-abliteration-session-id wins.
# Cache headers: x-abliteration-session-id (session affinity routing hint for any generation endpoint; overrides prompt_cache_key)
# Cache policy: automatic prefix cache, best-effort (same project+model, identical prefix incl. tools/reasoning settings, enough tokens); cache reads billed 10%; verify via usage.prompt_tokens_details.cached_tokens.
# Docs: https://docs.abliteration.ai/capabilities/prompt-caching.md
name = "abliteration.ai"
env = ["ABLIT_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://api.abliteration.ai/v1"
doc = "https://docs.abliteration.ai/models"
