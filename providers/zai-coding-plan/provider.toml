# Cache key (chat): strip prompt_cache_key — same implicit cache on POST /api/coding/paas/v4/chat/completions; no key field, hits via usage.prompt_tokens_details.cached_tokens.
# Cache headers: none
# Cache policy: automatic implicit prefix cache — replay stable prefixes; plan credits bill cached input at the cached-input multiplier.
# Docs: https://docs.z.ai/guides/capabilities/cache
# OpenAI Chat endpoint: POST https://api.z.ai/api/coding/paas/v4/chat/completions.
# Coding Plan models currently available: glm-5.2, glm-5-turbo, glm-4.7.
# GLM-5.2 maps low|medium|high to high and xhigh|max|ultracode to max.
# https://docs.z.ai/devpack/overview (accessed 2026-07-31)
name = "Z.AI Coding Plan"
env = ["ZHIPU_API_KEY"]
npm = "@ai-sdk/openai-compatible"
doc = "https://docs.z.ai/devpack/overview"
api = "https://api.z.ai/api/coding/paas/v4"